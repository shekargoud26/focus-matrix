# Cloudflare Pages project config (frontend `dist/`).
# NOTE: Pages validation rejects the Workers `main` key, so the Worker entry
# lives in `wrangler.workers.toml` — see docs/deploy.md.
name = "focus-matrix"
pages_build_output_dir = "dist"
compatibility_date = "2024-03-20"

[[d1_databases]]
binding = "DB"
database_name = "focus-matrix"
database_id = "1c94fb3c-e969-4e37-b9e0-8edf0782dc6a"
migrations_dir = "drizzle"

# Uncomment to close registration (login still works). Dashboard variable
# of the same name is the alternative — use one method, not both.
# [vars]
# DISABLE_SIGNUPS = "true"
